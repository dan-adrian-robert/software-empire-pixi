<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="Software Empire - a 2D management/tycoon simulation game." />
    <title>Software Empire</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f1a;
        color: #e6e8ef;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f1a;
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        z-index: 10;
      }

      #loading.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">Loading Software Empire...</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
